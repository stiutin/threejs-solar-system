<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Solar System</title>
    <meta
      name="description"
      content="An interactive 3D solar system built with Three.js."
    />
    <meta name="theme-color" content="#02030a" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Three.js Solar System" />
    <meta
      property="og:description"
      content="An interactive 3D solar system built with Three.js: focus any planet, adjust the simulation speed and explore the scene."
    />
    <meta
      property="og:url"
      content="https://stiutin.github.io/threejs-solar-system/"
    />
    <meta
      property="og:image"
      content="https://stiutin.github.io/threejs-solar-system/preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>

    <div id="loader" class="loader">
      <p class="loader__title">Solar System</p>

      <div
        class="loader__track"
        role="progressbar"
        aria-label="Loading textures"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="loader-track"
      >
        <div class="loader__bar" id="loader-bar"></div>
      </div>

      <p class="loader__status" id="loader-status">Loading textures 0%</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
